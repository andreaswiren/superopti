[package]
name = "superopti"
version = "0.3.0"
edition = "2024"
description = "On-demand native Windows performance diagnostics"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = [
 "Win32_System_Services", "Win32_UI_Shell_Common", "Win32_System_Diagnostics_ProcessSnapshotting", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security_Authorization", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_System_Diagnostics_Etw", "Win32_System_Time", "Win32_System_Com", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_System_LibraryLoader",
 "Win32_System_Performance", "Win32_System_SystemInformation",
 "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
 "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_Controls",
 "Win32_System_Power", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_JobObjects", "Win32_UI_Input_KeyboardAndMouse", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
