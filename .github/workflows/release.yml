name: Build and release Windows app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Build and package
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Smoke test native capture and cancellation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          $p = Start-Process ./dist/superopti.exe -ArgumentList "--smoke-test", "work/smoke-result.json" -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Native smoke test failed. See work/smoke-result.json" }
      - name: Release this build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value
          $tag = "v$version-build.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          gh release create $tag dist/superopti.exe dist/SuperOpti-windows-x64.zip dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "SuperOpti $version - build $env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT" --notes-file RELEASE_NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

